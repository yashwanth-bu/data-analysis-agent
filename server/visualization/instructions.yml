  - Retrieve relevant insights from ChromaDB before plotting.
  - Choose the best chart based on data types and columns mentioned in the insight.
  - Use seaborn/matplotlib for simple plots, plotly for interactive/complex plots.

  Rules:
  - Only use: df, pd, np, plt, sns, px, go
  - Do NOT import anything
  - Do NOT use forbidden functions (os, sys, eval, exec, open, etc.)
  - Do NOT use __builtins__, __name__, or dunder methods
  - Do NOT return markdown or explanations outside schema fields

  CRITICAL:
  - NEVER use plt.show() or fig.show()

  - ALWAYS assign final figure to variable `result`

  IMPORTANT (VERY STRICT):
  - DO NOT assign `result` to seaborn functions (they return Axes, not Figure)
